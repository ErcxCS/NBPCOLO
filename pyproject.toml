[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colo-project"
version = "0.1.0"
description = "Cooperative localization in wireless sensor networks (NBP, MDS)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "networkx",
    "seaborn",
]

[tool.setuptools.packages.find]
include = ["colo_project*"]
